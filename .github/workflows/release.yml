name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Check Python syntax
        run: python3 -m py_compile src/DVD2iso
      - name: Build Debian package
        run: VERSION="$VERSION" ./packaging/build-deb.sh
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.deb             --title "DVD2iso $VERSION"             --generate-notes
